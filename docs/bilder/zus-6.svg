"/><polygon fill="#1976D2" points="40.15,135.68,43.6022,126.456,39.8497,130.689,35.6167,126.9365,40.15,135.68" style="stroke: #1976D2; stroke-width: 1.0;"/><text fill="#0D47A1" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="223" x="40" y="101.9951">bezahlen() / Rechnung erstellen</text><!--link NichtVerifiziert to Aktiv--><path d="M307,58.29 C307,78.95 307,108.67 307,130.65 " fill="none" id="NichtVerifiziert-Aktiv" style="stroke: #1976D2; stroke-width: 1.0;"/><polygon fill="#1976D2" points="307,135.78,311,126.78,307,130.78,303,126.78,307,135.78" style="stroke: #1976D2; stroke-width: 1.0;"/><text fill="#0D47A1" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="296" x="308" y="101.9951">registrieren() / Bestätigungs-E-Mail senden</text><!--link Aktiv to Aktiv--><path d="M333.02,150.11 C350.69,146.93 368,150.56 368,161 C368,170.38 354.03,174.26 338.37,172.64 " fill="none" id="Aktiv-Aktiv" style="stroke: #1976D2; stroke-width: 1.0;"/><polygon fill="#1976D2" points="333.02,171.89,341.3723,177.1091,337.9709,172.5891,342.4909,169.1877,333.02,171.89" style="stroke: #1976D2; stroke-width: 1.0;"/><text fill="#0D47A1" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="373" x="374" y="165.9951">login() [Passwort falsch] / Fehlversuch-Zähler erhöhen</text><!--
@startuml
skinparam backgroundColor #FFFFFF
skinparam defaultFontName Helvetica
skinparam defaultFontSize 14
skinparam shadowing false
skinparam roundCorner 12
skinparam ArrowColor #1976D2
skinparam ArrowFontColor #0D47A1

skinparam actor {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
}
skinparam usecase {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
}
skinparam class {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
  AttributeFontColor #0D47A1
  HeaderBackgroundColor #BBDEFB
}
skinparam state {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
  ArrowColor #1976D2
  StartColor #222222
  EndColor #222222
}
skinparam sequence {
  ParticipantBackgroundColor #E3F2FD
  ParticipantBorderColor #1976D2
  ParticipantFontColor #0D47A1
  ActorBackgroundColor #E3F2FD
  ActorBorderColor #1976D2
  LifeLineBorderColor #90A4AE
  LifeLineBackgroundColor #ECEFF1
  BoxBorderColor #1976D2
}
skinparam activity {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
  DiamondBackgroundColor #FFF3E0
  DiamondBorderColor #FB8C00
  StartColor #222222
  EndColor #222222
  BarColor #455A64
}
state Neu
state Bezahlt
state NichtVerifiziert
state Aktiv

Neu - -> Bezahlt : bezahlen() / Rechnung erstellen
NichtVerifiziert - -> Aktiv : registrieren() / Bestätigungs-E-Mail senden
Aktiv - -> Aktiv : login() [Passwort falsch] / Fehlversuch-Zähler erhöhen
@enduml

