: BestellController</text><rect fill="#E3F2FD" height="30.2969" rx="6" ry="6" style="stroke: #1976D2; stroke-width: 1.5;" width="158" x="220" y="330.2656"/><text fill="#0D47A1" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="144" x="227" y="350.2607">ctrl: BestellController</text><rect fill="#E3F2FD" height="30.2969" rx="6" ry="6" style="stroke: #1976D2; stroke-width: 1.5;" width="95" x="436.5" y="3"/><text fill="#0D47A1" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="81" x="443.5" y="22.9951">lager: Lager</text><rect fill="#E3F2FD" height="30.2969" rx="6" ry="6" style="stroke: #1976D2; stroke-width: 1.5;" width="95" x="436.5" y="330.2656"/><text fill="#0D47A1" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="81" x="443.5" y="350.2607">lager: Lager</text><rect fill="#ECEFF1" height="254.6719" style="stroke: #90A4AE; stroke-width: 1.0;" width="10" x="294" y="66.5938"/><rect fill="#ECEFF1" height="30.2969" style="stroke: #90A4AE; stroke-width: 1.0;" width="10" x="479" y="96.8906"/><polygon fill="#1976D2" points="282,62.5938,292,66.5938,282,70.5938,286,66.5938" style="stroke: #1976D2; stroke-width: 1.0;"/><line style="stroke: #1976D2; stroke-width: 1.0;" x1="65" x2="288" y1="66.5938" y2="66.5938"/><text fill="#0D47A1" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="210" x="72" y="61.292">pruefeVerfuegbarkeit(produkt)</text><polygon fill="#1976D2" points="467,92.8906,477,96.8906,467,100.8906,471,96.8906" style="stroke: #1976D2; stroke-width: 1.0;"/><line style="stroke: #1976D2; stroke-width: 1.0;" x1="304" x2="473" y1="96.8906" y2="96.8906"/><text fill="#0D47A1" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="156" x="311" y="91.5889">istVerfuegbar(produkt)</text><polygon fill="#1976D2" points="315,123.1875,305,127.1875,315,131.1875,311,127.1875" style="stroke: #1976D2; stroke-width: 1.0;"/><line style="stroke: #1976D2; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="309" x2="483" y1="127.1875" y2="127.1875"/><text fill="#0D47A1" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="74" x="321" y="121.8857">verfuegbar</text><path d="M19,142.1875 L77,142.1875 L77,150.1875 L67,160.1875 L13,160.1875 L13,148.1875 " fill="#EEEEEE" style="stroke: #000000; stroke-width: 1.0;"/><rect fill="none" height="172.0781" rx="6" ry="6" style="stroke: #000000; stroke-width: 2.0;" width="375" x="13" y="142.1875"/><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="19" x="28" y="156.1826">alt</text><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="199" x="92" y="157.1826">[alle Produkte verfügbar]</text><polygon fill="#1976D2" points="76,180.0781,66,184.0781,76,188.0781,72,184.0781" style="stroke: #1976D2; stroke-width: 1.0;"/><line style="stroke: #1976D2; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="70" x2="293" y1="184.0781" y2="184.0781"/><text fill="#0D47A1" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="39" x="82" y="178.7764">erfolg</text><polygon fill="#1976D2" points="282,210.375,292,214.375,282,218.375,286,214.375" style="stroke: #1976D2; stroke-width: 1.0;"/><line style="stroke: #1976D2; stroke-width: 1.0;" x1="65" x2="288" y1="214.375" y2="214.375"/><text fill="#0D47A1" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="167" x="72" y="209.0732">bestaetigenBestellung()</text><line style="stroke: #000000; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="13" x2="388" y1="223.375" y2="223.375"/><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="211" x="18" y="236.3701">[Produkte nicht verfügbar]</text><polygon fill="#1976D2" points="76,258.9688,66,262.9688,76,266.9688,72,262.9688" style="stroke: #1976D2; stroke-width: 1.0;"/><line style="stroke: #1976D2; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="70" x2="293" y1="262.9688" y2="262.9688"/><text fill="#0D47A1" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="39" x="82" y="257.667">fehler</text><line style="stroke: #1976D2; stroke-width: 1.0;" x1="65" x2="107" y1="293.2656" y2="293.2656"/><line style="stroke: #1976D2; stroke-width: 1.0;" x1="107" x2="107" y1="293.2656" y2="306.2656"/><line style="stroke: #1976D2; stroke-width: 1.0;" x1="66" x2="107" y1="306.2656" y2="306.2656"/><polygon fill="#1976D2" points="76,302.2656,66,306.2656,76,310.2656,72,306.2656" style="stroke: #1976D2; stroke-width: 1.0;"/><text fill="#0D47A1" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="152" x="72" y="287.9639">zeigeFehlermeldung()</text><!--
@startuml
skinparam backgroundColor #FFFFFF
skinparam defaultFontName Helvetica
skinparam defaultFontSize 14
skinparam shadowing false
skinparam roundCorner 12
skinparam ArrowColor #1976D2
skinparam ArrowFontColor #0D47A1

skinparam actor {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
}
skinparam usecase {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
}
skinparam class {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
  AttributeFontColor #0D47A1
  HeaderBackgroundColor #BBDEFB
}
skinparam state {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
  ArrowColor #1976D2
  StartColor #222222
  EndColor #222222
}
skinparam sequence {
  ParticipantBackgroundColor #E3F2FD
  ParticipantBorderColor #1976D2
  ParticipantFontColor #0D47A1
  ActorBackgroundColor #E3F2FD
  ActorBorderColor #1976D2
  LifeLineBorderColor #90A4AE
  LifeLineBackgroundColor #ECEFF1
  BoxBorderColor #1976D2
}
skinparam activity {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
  DiamondBackgroundColor #FFF3E0
  DiamondBorderColor #FB8C00
  StartColor #222222
  EndColor #222222
  BarColor #455A64
}
participant "ui: ShopUI" as UI
participant "ctrl: BestellController" as Ctrl
participant "lager: Lager" as Lager

UI -> Ctrl: pruefeVerfuegbarkeit(produkt)
activate Ctrl

Ctrl -> Lager: istVerfuegbar(produkt)
activate Lager
Lager - -> Ctrl: verfuegbar
deactivate Lager

alt alle Produkte verfügbar
    Ctrl - -> UI: erfolg
    UI -> Ctrl: bestaetigenBestellung()
else Produkte nicht verfügbar
    Ctrl - -> UI: fehler
    UI -> UI: zeigeFehlermeldung()
end

deactivate Ctrl

@enduml

