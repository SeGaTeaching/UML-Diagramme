}
left to right direction

actor Kunde

rectangle "Pizzabestellsystem" {
  usecase "Pizza bestellen" as UC1
  usecase "Extra-Belag hinzufügen" as UC2
}

Kunde - -> UC1
UC2 .> UC1 : <<extend>>
@enduml

