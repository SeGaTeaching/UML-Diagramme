@startuml
skinparam backgroundColor #FFFFFF
skinparam defaultFontName Helvetica
skinparam defaultFontSize 14
skinparam shadowing false
skinparam roundCorner 12
skinparam ArrowColor #1976D2
skinparam ArrowFontColor #0D47A1

skinparam actor {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
}
skinparam usecase {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
}
skinparam class {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
  AttributeFontColor #0D47A1
  HeaderBackgroundColor #BBDEFB
}
skinparam state {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
  ArrowColor #1976D2
  StartColor #222222
  EndColor #222222
}
skinparam sequence {
  ParticipantBackgroundColor #E3F2FD
  ParticipantBorderColor #1976D2
  ParticipantFontColor #0D47A1
  ActorBackgroundColor #E3F2FD
  ActorBorderColor #1976D2
  LifeLineBorderColor #90A4AE
  LifeLineBackgroundColor #ECEFF1
  BoxBorderColor #1976D2
}
skinparam activity {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
  DiamondBackgroundColor #FFF3E0
  DiamondBorderColor #FB8C00
  StartColor #222222
  EndColor #222222
  BarColor #455A64
}
rectangle "UML: Klasse" as A #E1F5FF
rectangle "Python: class" as B #C8E6C9
rectangle "UML: Attribut" as C #E1F5FF
rectangle "Python: self._attribut" as D #C8E6C9
rectangle "UML: Methode" as E #E1F5FF
rectangle "Python: def methode()" as F #C8E6C9
rectangle "UML: Vererbung" as G #E1F5FF
rectangle "Python: class Kind(Parent)" as H #C8E6C9
rectangle "UML: Assoziation" as I #E1F5FF
rectangle "Python: Referenz-Attribut" as J #C8E6C9

A -right-> B : wird zu
C -right-> D : wird zu
E -right-> F : wird zu
G -right-> H : wird zu
I -right-> J : wird zu
@enduml

