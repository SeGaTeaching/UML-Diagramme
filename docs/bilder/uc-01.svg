@startuml
skinparam backgroundColor #FFFFFF
skinparam defaultFontName Helvetica
skinparam defaultFontSize 14
skinparam shadowing false
skinparam roundCorner 12
skinparam ArrowColor #1976D2
skinparam ArrowFontColor #0D47A1

skinparam actor {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
}
skinparam usecase {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
}
skinparam class {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
  AttributeFontColor #0D47A1
  HeaderBackgroundColor #BBDEFB
}
skinparam state {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
  ArrowColor #1976D2
  StartColor #222222
  EndColor #222222
}
skinparam sequence {
  ParticipantBackgroundColor #E3F2FD
  ParticipantBorderColor #1976D2
  ParticipantFontColor #0D47A1
  ActorBackgroundColor #E3F2FD
  ActorBorderColor #1976D2
  LifeLineBorderColor #90A4AE
  LifeLineBackgroundColor #ECEFF1
  BoxBorderColor #1976D2
}
skinparam activity {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
  DiamondBackgroundColor #FFF3E0
  DiamondBorderColor #FB8C00
  StartColor #222222
  EndColor #222222
  BarColor #455A64
}
skinparam rectangle {
  BackgroundColor #F5F5F5
  BorderColor #333333
  FontColor #000000
}
skinparam ArrowColor #555555

rectangle "UML-Diagramme" as UML

rectangle "Strukturdiagramme\nWAS ist das System?" as Struktur #D4EDDA
rectangle "Verhaltensdiagramme\nWIE verhält sich das System?" as Verhalten #CCE5FF

rectangle "Klassendiagramm" as Klasse
rectangle "Objektdiagramm" as Objekt
rectangle "Komponentendiagramm" as Komponente

rectangle "Use-Case-Diagramm\n(Wir sind hier)" as UC #FFF3CD
rectangle "Aktivitätsdiagramm" as Aktivitaet
rectangle "Sequenzdiagramm" as Sequenz
rectangle "Zustandsdiagramm" as Zustand

UML - -> Struktur
UML - -> Verhalten

Struktur - -> Klasse
Struktur - -> Objekt
Struktur - -> Komponente

Verhalten - -> UC
Verhalten - -> Aktivitaet
Verhalten - -> Sequenz
Verhalten - -> Zustand
@enduml

