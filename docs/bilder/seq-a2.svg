style="stroke: #1976D2; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="38.5" x2="204.5" y1="430.5625" y2="430.5625"/><text fill="#0D47A1" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="134" x="50.5" y="425.2607">gibGeldAus(betrag)</text><!--
@startuml
skinparam backgroundColor #FFFFFF
skinparam defaultFontName Helvetica
skinparam defaultFontSize 14
skinparam shadowing false
skinparam roundCorner 12
skinparam ArrowColor #1976D2
skinparam ArrowFontColor #0D47A1

skinparam actor {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
}
skinparam usecase {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
}
skinparam class {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
  AttributeFontColor #0D47A1
  HeaderBackgroundColor #BBDEFB
}
skinparam state {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
  ArrowColor #1976D2
  StartColor #222222
  EndColor #222222
}
skinparam sequence {
  ParticipantBackgroundColor #E3F2FD
  ParticipantBorderColor #1976D2
  ParticipantFontColor #0D47A1
  ActorBackgroundColor #E3F2FD
  ActorBorderColor #1976D2
  LifeLineBorderColor #90A4AE
  LifeLineBackgroundColor #ECEFF1
  BoxBorderColor #1976D2
}
skinparam activity {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
  DiamondBackgroundColor #FFF3E0
  DiamondBorderColor #FB8C00
  StartColor #222222
  EndColor #222222
  BarColor #455A64
}
actor Kunde
participant "automat: Geldautomat" as Automat
participant "bank: Bankserver" as Bank

Kunde -> Automat: karteEinfuehren()
activate Automat

Automat -> Bank: pruefeKarte(kartennummer)
activate Bank
Bank - -> Automat: kartenStatus
deactivate Bank

Kunde -> Automat: gibPinEin(pin)
Automat -> Bank: pruefePin(kartennummer, pin)
activate Bank
Bank - -> Automat: pinKorrekt
deactivate Bank

Kunde -> Automat: gibBetragEin(betrag)
Automat -> Bank: pruefeGuthaben(kartennummer, betrag)
activate Bank
Bank - -> Automat: guthabenAusreichend
deactivate Bank

Automat -> Automat: zaehleScheineAus(betrag)
Automat - -> Kunde: gibGeldAus(betrag)
deactivate Automat
@enduml

