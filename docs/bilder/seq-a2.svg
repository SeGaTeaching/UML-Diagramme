><polygon fill="#1976D2" points="496.5,140.8906,506.5,144.8906,496.5,148.8906,500.5,144.8906" style="stroke: #1976D2; stroke-width: 1.0;"/><line style="stroke: #1976D2; stroke-width: 1.0;" x1="210.5" x2="502.5" y1="144.8906" y2="144.8906"/><text fill="#0D47A1" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="193" x="217.5" y="139.5889">pruefeKarte(kartennummer)</text><polygon fill="#1976D2" points="221.5,171.1875,211.5,175.1875,221.5,179.1875,217.5,175.1875" style="stroke: #1976D2; stroke-width: 1.0;"/><line style="stroke: #1976D2; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="215.5" x2="512.5" y1="175.1875" y2="175.1875"/><text fill="#0D47A1" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="88" x="227.5" y="169.8857">kartenStatus</text><polygon fill="#1976D2" points="188.5,201.4844,198.5,205.4844,188.5,209.4844,192.5,205.4844" style="stroke: #1976D2; stroke-width: 1.0;"/><line style="stroke: #1976D2; stroke-width: 1.0;" x1="33.5" x2="194.5" y1="205.4844" y2="205.4844"/><text fill="#0D47A1" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="94" x="40.5" y="200.1826">gibPinEin(pin)</text><polygon fill="#1976D2" points="496.5,231.7813,506.5,235.7813,496.5,239.7813,500.5,235.7813" style="stroke: #1976D2; stroke-width: 1.0;"/><line style="stroke: #1976D2; stroke-width: 1.0;" x1="210.5" x2="502.5" y1="235.7813" y2="235.7813"/><text fill="#0D47A1" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="207" x="217.5" y="230.4795">pruefePin(kartennummer, pin)</text><polygon fill="#1976D2" points="221.5,262.0781,211.5,266.0781,221.5,270.0781,217.5,266.0781" style="stroke: #1976D2; stroke-width: 1.0;"/><line style="stroke: #1976D2; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="215.5" x2="512.5" y1="266.0781" y2="266.0781"/><text fill="#0D47A1" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="71" x="227.5" y