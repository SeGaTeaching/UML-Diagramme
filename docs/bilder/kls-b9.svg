@startuml
skinparam backgroundColor #FFFFFF
skinparam defaultFontName Helvetica
skinparam defaultFontSize 14
skinparam shadowing false
skinparam roundCorner 12
skinparam ArrowColor #1976D2
skinparam ArrowFontColor #0D47A1

skinparam actor {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
}
skinparam usecase {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
}
skinparam class {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
  AttributeFontColor #0D47A1
  HeaderBackgroundColor #BBDEFB
}
skinparam state {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
  ArrowColor #1976D2
  StartColor #222222
  EndColor #222222
}
skinparam sequence {
  ParticipantBackgroundColor #E3F2FD
  ParticipantBorderColor #1976D2
  ParticipantFontColor #0D47A1
  ActorBackgroundColor #E3F2FD
  ActorBorderColor #1976D2
  LifeLineBorderColor #90A4AE
  LifeLineBackgroundColor #ECEFF1
  BoxBorderColor #1976D2
}
skinparam activity {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
  DiamondBackgroundColor #FFF3E0
  DiamondBorderColor #FB8C00
  StartColor #222222
  EndColor #222222
  BarColor #455A64
}
class Medium {
  #titel: String
  #inventarnummer: String
  +verfuegbarkeitPruefen(): boolean
}
class Buch {
  -autor: String
  -isbn: String
}
class DVD {
  -laufzeit: int
  -regisseur: String
}
class Bibliothek {
  -name: String
  +medienAnzeigen(): void
}
class Mitglied {
  -mitgliedsnummer: String
  -name: String
}
class Ausleihe {
  -ausleihdatum: String
  -rueckgabedatum: String
}

Medium <|- - Buch
Medium <|- - DVD
Bibliothek "1" o- - "0..*" Medium : verwaltet
Mitglied "1" - - "0..*" Ausleihe : tätigt
Ausleihe "0..*" - - "1" Medium : betrifft
@enduml

