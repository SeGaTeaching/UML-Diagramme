: #1976D2; stroke-width: 1.0;"/><text fill="#0D47A1" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="106" x="231.5" y="185.9951">[Karte ungültig]</text><!--link VerifyCard to VerifyPin--><path d="M191.54,305.05 C208.41,321.01 228.63,338.8 248.5,353 C262.04,362.68 277.22,371.97 292.02,380.31 " fill="none" id="VerifyCard-VerifyPin" style="stroke: #1976D2; stroke-width: 1.0;"/><polygon fill="#1976D2" points="296.59,382.87,290.6652,375.0026,292.2192,380.4418,286.78,381.9958,296.59,382.87" style="stroke: #1976D2; stroke-width: 1.0;"/><text fill="#0D47A1" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="88" x="249.5" y="348.9951">[Karte gültig]</text><!--link VerifyPin to AccountActions--><path d="M380.4,452.01 C390.95,474.26 404.7,503.22 414.96,524.85 " fill="none" id="VerifyPin-AccountActions" style="stroke: #1976D2; stroke-width: 1.0;"/><polygon fill="#1976D2" points="417.22,529.63,416.9741,519.7842,415.0759,525.1131,409.747,523.2148,417.22,529.63" style="stroke: #1976D2; stroke-width: 1.0;"/><text fill="#0D47A1" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="85" x="403.5" y="495.9951">[PIN korrekt]</text><!--link VerifyPin to Idle--><path d="M367.41,382.68 C370.28,334.16 370.8,242.85 342.5,172 C338.88,162.94 333.28,154.17 327.28,146.38 " fill="none" id="VerifyPin-Idle" style="stroke: #1976D2; stroke-width: 1.0;"/><polygon fill="#1976D2" points="323.91,142.15,326.4003,151.6788,327.03,146.0571,332.6517,146.6869,323.91,142.15" style="stroke: #1976D2; stroke-width: 1.0;"/><text fill="#0D47A1" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="261" x="368.5" y="267.4951">[PIN falsch] / Fehlermeldung anzeigen</text><!--link AccountActions to DispenseMoney--><path d="M437.62,583.09 C444.03,603.29 453.13,632 460.81,656.21 " fill="none" id="AccountActions-DispenseMoney" style="stroke: #1976D2; stroke-width: 1.0;"/><polygon fill="#1976D2" poin