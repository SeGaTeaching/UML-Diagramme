th="44" x="832.5" y="24.7969">Küche</text><line style="stroke: #000000; stroke-width: 2.0;" x1="10" x2="10" y1="11.8018" y2="800.1768"/><line style="stroke: #000000; stroke-width: 2.0;" x1="193" x2="193" y1="11.8018" y2="800.1768"/><line style="stroke: #000000; stroke-width: 2.0;" x1="656" x2="656" y1="11.8018" y2="800.1768"/><line style="stroke: #000000; stroke-width: 2.0;" x1="1053" x2="1053" y1="11.8018" y2="800.1768"/><!--
@startuml
skinparam backgroundColor #FFFFFF
skinparam defaultFontName Helvetica
skinparam defaultFontSize 14
skinparam shadowing false
skinparam roundCorner 12
skinparam ArrowColor #1976D2
skinparam ArrowFontColor #0D47A1

skinparam actor {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
}
skinparam usecase {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
}
skinparam class {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
  AttributeFontColor #0D47A1
  HeaderBackgroundColor #BBDEFB
}
skinparam state {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
  ArrowColor #1976D2
  StartColor #222222
  EndColor #222222
}
skinparam sequence {
  ParticipantBackgroundColor #E3F2FD
  ParticipantBorderColor #1976D2
  ParticipantFontColor #0D47A1
  ActorBackgroundColor #E3F2FD
  ActorBorderColor #1976D2
  LifeLineBorderColor #90A4AE
  LifeLineBackgroundColor #ECEFF1
  BoxBorderColor #1976D2
}
skinparam activity {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
  DiamondBackgroundColor #FFF3E0
  DiamondBorderColor #FB8C00
  StartColor #222222
  EndColor #222222
  BarColor #455A64
}
skinparam ActivityStartColor black
skinparam ActivityEndColor black
skinparam ActivityBackgroundColor #E3F2FD
skinparam ActivityBorderColor #1976D2
skinparam ActivityFontColor #0D47A1
skinparam ActivityDiamondBackgroundColor #FFF9C4
skinparam ActivityDiamondBorderColor #FBC02D
skinparam ActivityBarColor black
!pragma useVerticalIf on

|#e3f2fd|Kunde|
start
:Bestellung aufgeben;
|#fff3e0|Kellner|
repeat
  :Bestellung an Küche weitergeben;
  |#f3e5f5|Küche|
  :Verfügbarkeit prüfen;
  |#fff3e0|Kellner|
backward:Bestellung anpassen;
repeat while (Gericht nicht verfügbar?) is ([ja]) not ([nein])
fork
  |#f3e5f5|Küche|
  :Speisen zubereiten;
fork again
  |#fff3e0|Kellner|
  :Getränke vorbereiten;
end fork
|#fff3e0|Kellner|
:Speisen und Getränke servieren;
|#e3f2fd|Kunde|
:Essen genießen;
:Bezahlen;
stop
@enduml

