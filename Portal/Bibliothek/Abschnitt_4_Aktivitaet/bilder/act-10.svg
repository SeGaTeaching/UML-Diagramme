@startuml
skinparam backgroundColor #FFFFFF
skinparam defaultFontName Helvetica
skinparam defaultFontSize 14
skinparam shadowing false
skinparam roundCorner 12
skinparam ArrowColor #1976D2
skinparam ArrowFontColor #0D47A1

skinparam actor {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
}
skinparam usecase {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
}
skinparam class {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
  AttributeFontColor #0D47A1
  HeaderBackgroundColor #BBDEFB
}
skinparam state {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
  ArrowColor #1976D2
  StartColor #222222
  EndColor #222222
}
skinparam sequence {
  ParticipantBackgroundColor #E3F2FD
  ParticipantBorderColor #1976D2
  ParticipantFontColor #0D47A1
  ActorBackgroundColor #E3F2FD
  ActorBorderColor #1976D2
  LifeLineBorderColor #90A4AE
  LifeLineBackgroundColor #ECEFF1
  BoxBorderColor #1976D2
}
skinparam activity {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
  DiamondBackgroundColor #FFF3E0
  DiamondBorderColor #FB8C00
  StartColor #222222
  EndColor #222222
  BarColor #455A64
}
!pragma useVerticalIf on

skinparam ActivityStartColor black
skinparam ActivityEndColor black
skinparam ActivityBackgroundColor white
skinparam ActivityBorderColor #1976D2
skinparam ActivityFontColor #0D47A1
skinparam ActivityDiamondBackgroundColor #FFF9C4
skinparam ActivityDiamondBorderColor #FBC02D
skinparam ActivityBarColor black


|#e3f2fd|Kunde|
start
:Artikel auswählen;
:Zur Kasse gehen;

|#fff3e0|Webshop|
:Verfügbarkeit prüfen;

if (Verfügbar?) then ([nicht verfügbar])
  :Bestellung abbrechen\n(nicht verfügbar);
  stop
else ([verfügbar])
  |#e3f2fd|Kunde|
  :Zahlung durchführen;
endif

|#fff3e0|Webshop|

if (Zahlung OK?) then ([fehlgeschlagen])
  :Bestellung abbrechen\n(Zahlung fehlgeschlagen);
  stop
else ([erfolgreich])
  :Bestellung bestätigen;
endif

|#f3e5f5|Lager|
fork
  :Artikel kommissionieren;
fork again
  :Paket packen;
end fork

|#e8f5e9|Versand|
:Paket abholen;
:Paket zustellen;

stop
@enduml

