0.8594,554.5,386.8594" style="stroke: #1976D2; stroke-width: 1.0;"/><line style="stroke: #1976D2; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="552.5" x2="939.5" y1="386.8594" y2="386.8594"/><text fill="#0D47A1" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="39" x="564.5" y="381.5576">erfolg</text><polygon fill="#1976D2" points="769.5,413.1563,779.5,417.1563,769.5,421.1563,773.5,417.1563" style="stroke: #1976D2; stroke-width: 1.0;"/><line style="stroke: #1976D2; stroke-width: 1.0;" x1="547.5" x2="775.5" y1="417.1563" y2="417.1563"/><text fill="#0D47A1" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="215" x="554.5" y="411.8545">reserviereProdukte(warenkorb)</text><polygon fill="#1976D2" points="558.5,443.4531,548.5,447.4531,558.5,451.4531,554.5,447.4531" style="stroke: #1976D2; stroke-width: 1.0;"/><line style="stroke: #1976D2; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="552.5" x2="785.5" y1="447.4531" y2="447.4531"/><text fill="#0D47A1" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="65" x="564.5" y="442.1514">reserviert</text><polygon fill="#1976D2" points="289.5,473.75,279.5,477.75,289.5,481.75,285.5,477.75" style="stroke: #1976D2; stroke-width: 1.0;"/><line style="stroke: #1976D2; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="283.5" x2="541.5" y1="477.75" y2="477.75"/><text fill="#0D47A1" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="146" x="295.5" y="472.4482">bestellungErfolgreich</text><polygon fill="#1976D2" points="59.5,504.0469,49.5,508.0469,59.5,512.0469,55.5,508.0469" style="stroke: #1976D2; stroke-width: 1.0;"/><line style="stroke: #1976D2; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="53.5" x2="267.5" y1="508.0469" y2="508.0469"/><text fill="#0D47A1" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="141" x="65.5" y="502.7451">zeigeBestaetigung()</text><line style="stroke: #000000; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="13" x2="1047" y1="517.0469" y2="517.0469"/><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="211" x="18" y="530.042">[Produkte nicht verfügbar]</text><polygon fill="#1976D2" points="59.5,552.6406,49.5,556.6406,59.5,560.6406,55.5,556.6406" style="stroke: #1976D2; stroke-width: 1.0;"/><line style="stroke: #1976D2; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="53.5" x2="267.5" y1="556.6406" y2="556.6406"/><text fill="#0D47A1" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="152" x="65.5" y="551.3389">zeigeFehlermeldung()</text><!--
@startuml
skinparam backgroundColor #FFFFFF
skinparam defaultFontName Helvetica
skinparam defaultFontSize 14
skinparam shadowing false
skinparam roundCorner 12
skinparam ArrowColor #1976D2
skinparam ArrowFontColor #0D47A1

skinparam actor {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
}
skinparam usecase {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
}
skinparam class {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
  AttributeFontColor #0D47A1
  HeaderBackgroundColor #BBDEFB
}
skinparam state {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
  ArrowColor #1976D2
  StartColor #222222
  EndColor #222222
}
skinparam sequence {
  ParticipantBackgroundColor #E3F2FD
  ParticipantBorderColor #1976D2
  ParticipantFontColor #0D47A1
  ActorBackgroundColor #E3F2FD
  ActorBorderColor #1976D2
  LifeLineBorderColor #90A4AE
  LifeLineBackgroundColor #ECEFF1
  BoxBorderColor #1976D2
}
skinparam activity {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
  DiamondBackgroundColor #FFF3E0
  DiamondBorderColor #FB8C00
  StartColor #222222
  EndColor #222222
  BarColor #455A64
}
actor Kunde
participant "ui: ShopUI" as UI
participant "ctrl: BestellController" as Ctrl
participant "lager: Lager" as Lager
participant "zahlung: Zahlungssystem" as Zahlung

Kunde -> UI: bestelleProdukte(warenkorb)
activate UI

loop für jedes Produkt
    UI -> Ctrl: pruefeVerfuegbarkeit(produkt)
    activate Ctrl
    Ctrl -> Lager: istVerfuegbar(produkt)
    activate Lager
    Lager - -> Ctrl: verfuegbar
    deactivate Lager
    Ctrl - -> UI: verfuegbar
    deactivate Ctrl
end

alt alle Produkte verfügbar
    UI -> Ctrl: bestaetigenBestellung(warenkorb)
    activate Ctrl
    Ctrl -> Zahlung: verarbeiteZahlung(betrag)
    activate Zahlung
    Zahlung - -> Ctrl: erfolg
    deactivate Zahlung
    Ctrl -> Lager: reserviereProdukte(warenkorb)
    activate Lager
    Lager - -> Ctrl: reserviert
    deactivate Lager
    Ctrl - -> UI: bestellungErfolgreich
    deactivate Ctrl
    UI - -> Kunde: zeigeBestaetigung()
else Produkte nicht verfügbar
    UI - -> Kunde: zeigeFehlermeldung()
end

deactivate UI
@enduml

