-Schleudern" style="stroke: #1976D2; stroke-width: 1.0;"/><polygon fill="#1976D2" points="119.5,379.83,123.5,370.83,119.5,374.83,115.5,370.83,119.5,379.83" style="stroke: #1976D2; stroke-width: 1.0;"/><text fill="#0D47A1" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="128" x="120.5" y="345.9951">waschgangFertig()</text><!--link Schleudern to Fertig--><path d="M119.5,465.01 C119.5,488.2 119.5,516.56 119.5,537.49 " fill="none" id="Schleudern-Fertig" style="stroke: #1976D2; stroke-width: 1.0;"/><polygon fill="#1976D2" points="119.5,542.64,123.5,533.64,119.5,537.64,115.5,533.64,119.5,542.64" style="stroke: #1976D2; stroke-width: 1.0;"/><text fill="#0D47A1" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="153" x="120.5" y="508.9951">schleudergangFertig()</text><!--link Fertig to *end--><path d="M119.5,593.21 C119.5,610.84 119.5,634.13 119.5,648.84 " fill="none" id="Fertig-*end" style="stroke: #1976D2; stroke-width: 1.0;"/><polygon fill="#1976D2" points="119.5,653.84,123.5,644.84,119.5,648.84,115.5,644.84,119.5,653.84" style="stroke: #1976D2; stroke-width: 1.0;"/><!--
@startuml
skinparam backgroundColor #FFFFFF
skinparam defaultFontName Helvetica
skinparam defaultFontSize 14
skinparam shadowing false
skinparam roundCorner 12
skinparam ArrowColor #1976D2
skinparam ArrowFontColor #0D47A1

skinparam actor {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
}
skinparam usecase {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
}
skinparam class {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
  AttributeFontColor #0D47A1
  HeaderBackgroundColor #BBDEFB
}
skinparam state {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
  ArrowColor #1976D2
  StartColor #222222
  EndColor #222222
}
skinparam sequence {
  ParticipantBackgroundColor #E3F2FD
  ParticipantBorderColor #1976D2
  ParticipantFontColor #0D47A1
  ActorBackgroundColor #E3F2FD
  ActorBorderColor #1976D2
  LifeLineBorderColor #90A4AE
  LifeLineBackgroundColor #ECEFF1
  BoxBorderColor #1976D2
}
skinparam activity {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
  DiamondBackgroundColor #FFF3E0
  DiamondBorderColor #FB8C00
  StartColor #222222
  EndColor #222222
  BarColor #455A64
}
[*] - -> Bereit

state Waschen
Waschen : entry / Wasser einlassen
Waschen : do / Trommel drehen
Waschen : exit / Wasser abpumpen

state Schleudern
Schleudern : entry / Drehzahl hochfahren
Schleudern : do / Waesche schleudern
Schleudern : exit / Drehzahl herunterfahren

Bereit - -> Waschen : programmStarten() [Tuer geschlossen]
Waschen - -> Schleudern : waschgangFertig()
Schleudern - -> Fertig : schleudergangFertig()

Fertig - -> [*]
@enduml

