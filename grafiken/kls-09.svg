<?xml version="1.0" encoding="UTF-8" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentScriptType="application/ecmascript" contentStyleType="text/css" height="335px" preserveAspectRatio="none" style="width:504px;height:335px;" version="1.1" viewBox="0 0 504 335" width="504px" zoomAndPan="magnify"><defs/><g><!--entity Vererbung--><rect fill="#E1F5FF" height="52.5938" rx="6" ry="6" style="stroke: #000000; stroke-width: 1.5;" width="93" x="32.5" y="272"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="73" x="42.5" y="294.9951">Vererbung</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="52" x="42.5" y="311.292">(ist-ein)</text><!--entity DreieckPfeil--><rect fill="#FFFFFF" height="36.2969" rx="6" ry="6" style="stroke: #000000; stroke-width: 1.5;" width="106" x="381" y="280.5"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="86" x="391" y="303.4951">Dreieck-Pfeil</text><!--entity Assoziation--><rect fill="#FFF4E1" height="52.5938" rx="6" ry="6" style="stroke: #000000; stroke-width: 1.5;" width="99" x="29.5" y="184"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="79" x="39.5" y="206.9951">Assoziation</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="76" x="39.5" y="223.292">(kennt-ein)</text><!--entity EinfacheLinie--><rect fill="#FFFFFF" height="36.2969" rx="6" ry="6" style="stroke: #000000; stroke-width: 1.5;" width="114" x="377" y="192.5"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="94" x="387" y="215.4951">Einfache Linie</text><!--entity Aggregation--><rect fill="#E8F5E9" height="52.5938" rx="6" ry="6" style="stroke: #000000; stroke-width: 1.5;" width="115" x="21.5" y="96"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="84" x="31.5" y="118.9951">Aggregation</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="95" x="31.5" y="135.292">(hat-ein, lose)</text><!--entity HohleRaute--><rect fill="#FFFFFF" height="36.2969" rx="6" ry="6" style="stroke: #000000; stroke-width: 1.5;" width="105" x="381.5" y="104.5"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="85" x="391.5" y="127.4951">Hohle Raute</text><!--entity Komposition--><rect fill="#FCE4EC" height="52.5938" rx="6" ry="6" style="stroke: #000000; stroke-width: 1.5;" width="146" x="6" y="8"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="86" x="16" y="30.9951">Komposition</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="126" x="16" y="47.292">(enthält-ein, stark)</text><!--entity GefuellteRaute--><rect fill="#FFFFFF" height="36.2969" rx="6" ry="6" style="stroke: #000000; stroke-width: 1.5;" width="118" x="375" y="16.5"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="98" x="385" y="39.4951">Gefüllte Raute</text><!--link Vererbung to DreieckPfeil--><path d="M125.79,298.5 C189.78,298.5 305.95,298.5 375.63,298.5 " fill="none" id="Vererbung-DreieckPfeil" style="stroke: #1976D2; stroke-width: 1.0;"/><polygon fill="#1976D2" points="380.98,298.5,371.98,294.5,375.98,298.5,371.98,302.5,380.98,298.5" style="stroke: #1976D2; stroke-width: 1.0;"/><text fill="#0D47A1" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="161" x="183" y="294.4951">Sparkonto ist ein Konto</text><!--link Assoziation to EinfacheLinie--><path d="M128.71,210.5 C192.03,210.5 302.64,210.5 371.63,210.5 " fill="none" id="Assoziation-EinfacheLinie" style="stroke: #1976D2; stroke-width: 1.0;"/><polygon fill="#1976D2" points="376.93,210.5,367.93,206.5,371.93,210.5,367.93,214.5,376.93,210.5" style="stroke: #1976D2; stroke-width: 1.0;"/><text fill="#0D47A1" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="124" x="201.5" y="206.4951">Fahrer kennt Auto</text><!--link Aggregation to HohleRaute--><path d="M136.72,122.5 C202.53,122.5 310.42,122.5 376.25,122.5 " fill="none" id="Aggregation-HohleRaute" style="stroke: #1976D2; stroke-width: 1.0;"/><polygon fill="#1976D2" points="381.31,122.5,372.31,118.5,376.31,122.5,372.31,126.5,381.31,122.5" style="stroke: #1976D2; stroke-width: 1.0;"/><text fill="#0D47A1" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="116" x="205.5" y="118.4951">Team hat Spieler</text><!--link Komposition to GefuellteRaute--><path d="M152.29,34.5 C216.25,34.5 308.65,34.5 369.74,34.5 " fill="none" id="Komposition-GefuellteRaute" style="stroke: #1976D2; stroke-width: 1.0;"/><polygon fill="#1976D2" points="374.81,34.5,365.81,30.5,369.81,34.5,365.81,38.5,374.81,34.5" style="stroke: #1976D2; stroke-width: 1.0;"/><text fill="#0D47A1" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="140" x="193.5" y="30.4951">Haus enthält Räume</text><!--
@startuml
skinparam backgroundColor #FFFFFF
skinparam defaultFontName Helvetica
skinparam defaultFontSize 14
skinparam shadowing false
skinparam roundCorner 12
skinparam ArrowColor #1976D2
skinparam ArrowFontColor #0D47A1

skinparam actor {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
}
skinparam usecase {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
}
skinparam class {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
  AttributeFontColor #0D47A1
  HeaderBackgroundColor #BBDEFB
}
skinparam state {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
  ArrowColor #1976D2
  StartColor #222222
  EndColor #222222
}
skinparam sequence {
  ParticipantBackgroundColor #E3F2FD
  ParticipantBorderColor #1976D2
  ParticipantFontColor #0D47A1
  ActorBackgroundColor #E3F2FD
  ActorBorderColor #1976D2
  LifeLineBorderColor #90A4AE
  LifeLineBackgroundColor #ECEFF1
  BoxBorderColor #1976D2
}
skinparam activity {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
  DiamondBackgroundColor #FFF3E0
  DiamondBorderColor #FB8C00
  StartColor #222222
  EndColor #222222
  BarColor #455A64
}
left to right direction
rectangle "Vererbung\n(ist-ein)" as Vererbung #E1F5FF
rectangle "Dreieck-Pfeil" as DreieckPfeil #FFFFFF
rectangle "Assoziation\n(kennt-ein)" as Assoziation #FFF4E1
rectangle "Einfache Linie" as EinfacheLinie #FFFFFF
rectangle "Aggregation\n(hat-ein, lose)" as Aggregation #E8F5E9
rectangle "Hohle Raute" as HohleRaute #FFFFFF
rectangle "Komposition\n(enthält-ein, stark)" as Komposition #FCE4EC
rectangle "Gefüllte Raute" as GefuellteRaute #FFFFFF

Vererbung - -> DreieckPfeil : Sparkonto ist ein Konto
Assoziation - -> EinfacheLinie : Fahrer kennt Auto
Aggregation - -> HohleRaute : Team hat Spieler
Komposition - -> GefuellteRaute : Haus enthält Räume
@enduml

