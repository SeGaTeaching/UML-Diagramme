@startuml
skinparam backgroundColor #FFFFFF
skinparam defaultFontName Helvetica
skinparam defaultFontSize 14
skinparam shadowing false
skinparam roundCorner 12
skinparam ArrowColor #1976D2
skinparam ArrowFontColor #0D47A1

skinparam actor {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
}
skinparam usecase {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
}
skinparam class {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
  AttributeFontColor #0D47A1
  HeaderBackgroundColor #BBDEFB
}
skinparam state {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
  ArrowColor #1976D2
  StartColor #222222
  EndColor #222222
}
skinparam sequence {
  ParticipantBackgroundColor #E3F2FD
  ParticipantBorderColor #1976D2
  ParticipantFontColor #0D47A1
  ActorBackgroundColor #E3F2FD
  ActorBorderColor #1976D2
  LifeLineBorderColor #90A4AE
  LifeLineBackgroundColor #ECEFF1
  BoxBorderColor #1976D2
}
skinparam activity {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
  DiamondBackgroundColor #FFF3E0
  DiamondBorderColor #FB8C00
  StartColor #222222
  EndColor #222222
  BarColor #455A64
}
abstract class Person {
  -name: String
  -geburtsdatum: Date
}
class Schüler {
  -matrikelnr: String
}
class Lehrer {
  -personalnr: String
}
class Kurs {
  -titel: String
  -maxTeilnehmer: int
  -gebuehr: double
  +anmelden(s: Schüler): boolean
  +getFreiePlaetze(): int
}
class Fachbereich {
  -bezeichnung: String
}
class Kurstermin {
  -datum: Date
  -raum: String
}
Lehrer "1" - -> "0..*" Kurs : leitet >
Person <|- - Schüler
Person <|- - Lehrer
Fachbereich "1" o- - "1..*" Lehrer
Kurs "1" *- - "1..*" Kurstermin
@enduml

