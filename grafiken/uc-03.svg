@startuml
skinparam backgroundColor #FFFFFF
skinparam defaultFontName Helvetica
skinparam defaultFontSize 14
skinparam shadowing false
skinparam roundCorner 12
skinparam ArrowColor #1976D2
skinparam ArrowFontColor #0D47A1

skinparam actor {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
}
skinparam usecase {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
}
skinparam class {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
  AttributeFontColor #0D47A1
  HeaderBackgroundColor #BBDEFB
}
skinparam state {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
  ArrowColor #1976D2
  StartColor #222222
  EndColor #222222
}
skinparam sequence {
  ParticipantBackgroundColor #E3F2FD
  ParticipantBorderColor #1976D2
  ParticipantFontColor #0D47A1
  ActorBackgroundColor #E3F2FD
  ActorBorderColor #1976D2
  LifeLineBorderColor #90A4AE
  LifeLineBackgroundColor #ECEFF1
  BoxBorderColor #1976D2
}
skinparam activity {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
  DiamondBackgroundColor #FFF3E0
  DiamondBorderColor #FB8C00
  StartColor #222222
  EndColor #222222
  BarColor #455A64
}
left to right direction

actor Nutzer
actor Bibliothekar
actor "Bezahlsystem" as Bezahlsystem

rectangle "Bibliothekssystem" {
  usecase "Buch ausleihen" as UC1
  usecase "Buch zurückgeben" as UC2
  usecase "Buch suchen" as UC3
  usecase "Buch hinzufügen" as UC4
  usecase "Buch entfernen" as UC5
  usecase "Mahnung verschicken" as UC6
}

Nutzer - -> UC1
Nutzer - -> UC2
Nutzer - -> UC3

Bibliothekar - -> UC1
Bibliothekar - -> UC2
Bibliothekar - -> UC3
Bibliothekar - -> UC4
Bibliothekar - -> UC5
Bibliothekar - -> UC6

UC6 - -> Bezahlsystem : kommuniziert mit
@enduml

