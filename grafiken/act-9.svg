ne style="stroke: #1976D2; stroke-width: 1.5;" x1="319" x2="319" y1="224.8906" y2="244.8906"/><polygon fill="#1976D2" points="315,234.8906,319,244.8906,323,234.8906,319,238.8906" style="stroke: #1976D2; stroke-width: 1.0;"/><line style="stroke: #1976D2; stroke-width: 1.5;" x1="213" x2="213" y1="86.2969" y2="106.2969"/><polygon fill="#1976D2" points="209,96.2969,213,106.2969,217,96.2969,213,100.2969" style="stroke: #1976D2; stroke-width: 1.0;"/><line style="stroke: #1976D2; stroke-width: 1.5;" x1="213" x2="213" y1="250.8906" y2="270.8906"/><polygon fill="#1976D2" points="209,260.8906,213,270.8906,217,260.8906,213,264.8906" style="stroke: #1976D2; stroke-width: 1.0;"/><line style="stroke: #1976D2; stroke-width: 1.5;" x1="213" x2="213" y1="307.1875" y2="327.1875"/><polygon fill="#1976D2" points="209,317.1875,213,327.1875,217,317.1875,213,321.1875" style="stroke: #1976D2; stroke-width: 1.0;"/><!--
@startuml
skinparam backgroundColor #FFFFFF
skinparam defaultFontName Helvetica
skinparam defaultFontSize 14
skinparam shadowing false
skinparam roundCorner 12
skinparam ArrowColor #1976D2
skinparam ArrowFontColor #0D47A1

skinparam actor {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
}
skinparam usecase {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
}
skinparam class {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
  AttributeFontColor #0D47A1
  HeaderBackgroundColor #BBDEFB
}
skinparam state {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
  ArrowColor #1976D2
  StartColor #222222
  EndColor #222222
}
skinparam sequence {
  ParticipantBackgroundColor #E3F2FD
  ParticipantBorderColor #1976D2
  ParticipantFontColor #0D47A1
  ActorBackgroundColor #E3F2FD
  ActorBorderColor #1976D2
  LifeLineBorderColor #90A4AE
  LifeLineBackgroundColor #ECEFF1
  BoxBorderColor #1976D2
}
skinparam activity {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
  DiamondBackgroundColor #FFF3E0
  DiamondBorderColor #FB8C00
  StartColor #222222
  EndColor #222222
  BarColor #455A64
}
!pragma useVerticalIf on

skinparam ActivityStartColor black
skinparam ActivityEndColor black
skinparam ActivityBackgroundColor #E3F2FD
skinparam ActivityBorderColor #1976D2
skinparam ActivityFontColor #0D47A1
skinparam ActivityBarColor black


start

:Bestellung aufgeben;

fork
  :Lager informieren;
  :Artikel kommissionieren;
  
fork again
  :Rechnung erstellen;
  :Rechnung versenden;
  
end fork

:Paket versenden;

stop
@enduml

