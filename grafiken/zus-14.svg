le" style="stroke: #000000; stroke-width: 1.0;"/><polygon fill="#000000" points="249.26,142.13,251.7503,151.6588,252.38,146.0371,258.0017,146.6669,249.26,142.13" style="stroke: #000000; stroke-width: 1.0;"/><text fill="#0D47A1" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="76" x="292.8" y="267.4951">[PIN falsch]</text><!--link DispenseMoney to Idle--><path d="M385.66,529.82 C391.08,520.45 395.9,510.24 398.8,500 C432.78,379.92 440.83,327.7 377.8,220 C358.18,186.48 322.88,161.58 291.02,144.61 " fill="none" id="DispenseMoney-Idle" style="stroke: #000000; stroke-width: 1.0;"/><polygon fill="#000000" points="286.35,142.16,292.4739,149.8735,290.7814,144.4758,296.1791,142.7833,286.35,142.16" style="stroke: #000000; stroke-width: 1.0;"/><text fill="#0D47A1" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="120" x="424.8" y="348.9951">Transaktion fertig</text><!--
@startuml
skinparam backgroundColor #FFFFFF
skinparam defaultFontName Helvetica
skinparam defaultFontSize 14
skinparam shadowing false
skinparam roundCorner 12
skinparam ArrowColor #1976D2
skinparam ArrowFontColor #0D47A1

skinparam actor {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
}
skinparam usecase {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
}
skinparam class {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
  AttributeFontColor #0D47A1
  HeaderBackgroundColor #BBDEFB
}
skinparam state {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
  ArrowColor #1976D2
  StartColor #222222
  EndColor #222222
}
skinparam sequence {
  ParticipantBackgroundColor #E3F2FD
  ParticipantBorderColor #1976D2
  ParticipantFontColor #0D47A1
  ActorBackgroundColor #E3F2FD
  ActorBorderColor #1976D2
  LifeLineBorderColor #90A4AE
  LifeLineBackgroundColor #ECEFF1
  BoxBorderColor #1976D2
}
skinparam activity {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
  DiamondBackgroundColor #FFF3E0
  DiamondBorderColor #FB8C00
  StartColor #222222
  EndColor #222222
  BarColor #455A64
}
skinparam state {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
  ArrowColor black
  StartColor black
  EndColor black
}

[*] - -> Idle


state Idle
Idle : entry / Display zurücksetzen

state VerifyCard
VerifyCard : entry / Karte einlesen
VerifyCard : do / Karte validieren
VerifyCard : exit / Karte zurückgeben

state VerifyPin
VerifyPin : entry / PIN eingeben
VerifyPin : do / PIN prüfen

state DispenseMoney
DispenseMoney : entry / Betrag prüfen
DispenseMoney : do / Geld ausgeben
DispenseMoney : exit / Log schreiben


Idle - -> VerifyCard : Karte gesteckt

VerifyCard - -> VerifyPin : [Karte gültig]
VerifyCard - -> Idle : [Karte ungültig]

VerifyPin - -> DispenseMoney : [PIN korrekt]
VerifyPin - -> Idle : [PIN falsch]

DispenseMoney - -> Idle : Transaktion fertig

@enduml

