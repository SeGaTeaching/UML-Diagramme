.0;" x1="340.5" x2="330.5" y1="136.1875" y2="132.1875"/><line style="stroke: #1976D2; stroke-width: 1.0;" x1="340.5" x2="330.5" y1="136.1875" y2="140.1875"/><line style="stroke: #1976D2; stroke-width: 1.0;" x1="57.5" x2="341.5" y1="136.1875" y2="136.1875"/><text fill="#0D47A1" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="119" x="64.5" y="130.8857">sendeNachricht()</text><path d="M347,121.8906 L347,135.8906 A6,6 0 0 0 353,141.8906 L568,141.8906 A6,6 0 0 0 574,135.8906 L574,125.8906 L564,115.8906 L353,115.8906 A6,6 0 0 0 347,121.8906 " fill="#FBFB77" style="stroke: #A80036; stroke-width: 1.0;"/><path d="M564,115.8906 L564,122.8906 A3,3 0 0 0 567,125.8906 L574,125.8906 L564,115.8906 " fill="#FBFB77" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="206" x="353" y="133.8857">Asynchron: Client wartet nicht</text><!--
@startuml
skinparam backgroundColor #FFFFFF
skinparam defaultFontName Helvetica
skinparam defaultFontSize 14
skinparam shadowing false
skinparam roundCorner 12
skinparam ArrowColor #1976D2
skinparam ArrowFontColor #0D47A1

skinparam actor {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
}
skinparam usecase {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
}
skinparam class {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
  AttributeFontColor #0D47A1
  HeaderBackgroundColor #BBDEFB
}
skinparam state {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
  ArrowColor #1976D2
  StartColor #222222
  EndColor #222222
}
skinparam sequence {
  ParticipantBackgroundColor #E3F2FD
  ParticipantBorderColor #1976D2
  ParticipantFontColor #0D47A1
  ActorBackgroundColor #E3F2FD
  ActorBorderColor #1976D2
  LifeLineBorderColor #90A4AE
  LifeLineBackgroundColor #ECEFF1
  BoxBorderColor #1976D2
}
skinparam activity {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
  DiamondBackgroundColor #FFF3E0
  DiamondBorderColor #FB8C00
  StartColor #222222
  EndColor #222222
  BarColor #455A64
}
participant "client: Client" as Client
participant "server: Server" as Server
participant "queue: MessageQueue" as Queue

Client -> Server: sendeAnfrage()
activate Server
note right: Synchron: Client wartet

Server - -> Client: antwort
deactivate Server

Client ->> Queue: sendeNachricht()
note right: Asynchron: Client wartet nicht

@enduml

