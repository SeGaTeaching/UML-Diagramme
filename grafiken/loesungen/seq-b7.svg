gthAdjust="spacingAndGlyphs" textLength="81" x="92" y="251.7764">[Tuer frei]</text><polygon fill="#1976D2" points="258,274.6719,248,278.6719,258,282.6719,254,278.6719" style="stroke: #1976D2; stroke-width: 1.0;"/><line style="stroke: #1976D2; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="252" x2="464" y1="278.6719" y2="278.6719"/><text fill="#0D47A1" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="97" x="264" y="273.3701">tuerGeoeffnet</text><polygon fill="#1976D2" points="67,304.9688,57,308.9688,67,312.9688,63,308.9688" style="stroke: #1976D2; stroke-width: 1.0;"/><line style="stroke: #1976D2; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="61" x2="236" y1="308.9688" y2="308.9688"/><text fill="#0D47A1" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="140" x="73" y="303.667">signalisiereAnkunft()</text><line style="stroke: #000000; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="13" x2="521.5" y1="317.9688" y2="317.9688"/><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="123" x="18" y="330.9639">[Tuer blockiert]</text><polygon fill="#1976D2" points="258,353.5625,248,357.5625,258,361.5625,254,357.5625" style="stroke: #1976D2; stroke-width: 1.0;"/><line style="stroke: #1976D2; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="252" x2="464" y1="357.5625" y2="357.5625"/><text fill="#0D47A1" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="88" x="264" y="352.2607">tuerBlockiert</text><polygon fill="#1976D2" points="453,383.8594,463,387.8594,453,391.8594,457,387.8594" style="stroke: #1976D2; stroke-width: 1.0;"/><line style="stroke: #1976D2; stroke-width: 1.0;" x1="247" x2="459" y1="387.8594" y2="387.8594"/><text fill="#0D47A1" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="194" x="254" y="382.5576">versucheErneutZuOeffnen()</text><!--
@startuml
skinparam backgroundColor #FFFFFF
skinparam defaultFontName Helvetica
skinparam defaultFontSize 14
skinparam shadowing false
skinparam roundCorner 12
skinparam ArrowColor #1976D2
skinparam ArrowFontColor #0D47A1

skinparam actor {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
}
skinparam usecase {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
}
skinparam class {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
  AttributeFontColor #0D47A1
  HeaderBackgroundColor #BBDEFB
}
skinparam state {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
  ArrowColor #1976D2
  StartColor #222222
  EndColor #222222
}
skinparam sequence {
  ParticipantBackgroundColor #E3F2FD
  ParticipantBorderColor #1976D2
  ParticipantFontColor #0D47A1
  ActorBackgroundColor #E3F2FD
  ActorBorderColor #1976D2
  LifeLineBorderColor #90A4AE
  LifeLineBackgroundColor #ECEFF1
  BoxBorderColor #1976D2
}
skinparam activity {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
  DiamondBackgroundColor #FFF3E0
  DiamondBorderColor #FB8C00
  StartColor #222222
  EndColor #222222
  BarColor #455A64
}
actor Fahrgast
participant "steuerung: Aufzugsteuerung" as Steuerung
participant "tuer: Tuer" as Tuer

Fahrgast -> Steuerung: drueckeStockwerk(ziel)
activate Steuerung

loop bis Zielstockwerk erreicht
    Steuerung -> Steuerung: fahreEinStockwerk()
end

Steuerung -> Tuer: oeffneTuer()
activate Tuer

alt Tuer frei
    Tuer - -> Steuerung: tuerGeoeffnet
    Steuerung - -> Fahrgast: signalisiereAnkunft()
else Tuer blockiert
    Tuer - -> Steuerung: tuerBlockiert
    Steuerung -> Tuer: versucheErneutZuOeffnen()
end

deactivate Tuer
deactivate Steuerung
@enduml

