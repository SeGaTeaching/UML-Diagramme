 ry="6" style="stroke: #1976D2; stroke-width: 1.5;" width="241" x="491" y="3"/><text fill="#0D47A1" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="227" x="498" y="22.9951">dienst: BenachrichtigungsDienst</text><rect fill="#E3F2FD" height="30.2969" rx="6" ry="6" style="stroke: #1976D2; stroke-width: 1.5;" width="241" x="491" y="186.4844"/><text fill="#0D47A1" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="227" x="498" y="206.4795">dienst: BenachrichtigungsDienst</text><rect fill="#ECEFF1" height="30.2969" style="stroke: #90A4AE; stroke-width: 1.0;" width="10" x="277.5" y="66.5938"/><polygon fill="#1976D2" points="265.5,62.5938,275.5,66.5938,265.5,70.5938,269.5,66.5938" style="stroke: #1976D2; stroke-width: 1.0;"/><line style="stroke: #1976D2; stroke-width: 1.0;" x1="57.5" x2="271.5" y1="66.5938" y2="66.5938"/><text fill="#0D47A1" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="201" x="64.5" y="61.292">sendeBestellung(bestellung)</text><polygon fill="#1976D2" points="68.5,92.8906,58.5,96.8906,68.5,100.8906,64.5,96.8906" style="stroke: #1976D2; stroke-width: 1.0;"/><line style="stroke: #1976D2; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="62.5" x2="281.5" y1="96.8906" y2="96.8906"/><text fill="#0D47A1" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="165" x="74.5" y="91.5889">bestellungEingegangen</text><line style="stroke: #1976D2; stroke-width: 1.0;" x1="609.5" x2="599.5" y1="130.1875" y2="126.1875"/><line style="stroke: #1976D2; stroke-width: 1.0;" x1="609.5" x2="599.5" y1="130.1875" y2="134.1875"/><line style="stroke: #1976D2; stroke-width: 1.0;" x1="282.5" x2="610.5" y1="130.1875" y2="130.1875"/><text fill="#0D47A1" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="305" x="289.5" y="124.8857">informiereUeberNeueBestellung(bestellung)</text><path d="M616,115.8906 L616,129.8906 A6,6 0 0 0 