oke-width: 1.0;"/><text fill="#0D47A1" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="68" x="244.5" y="119.7451">«include»</text><!--link UC2 to Bank--><path d="M339.53,74 C399.07,74 499.85,74 558.78,74 " fill="none" id="UC2-Bank" style="stroke: #1976D2; stroke-width: 1.0;"/><polygon fill="#1976D2" points="564,74,555.0115,69.9743,559,73.9857,554.9886,77.9743,564,74" style="stroke: #1976D2; stroke-width: 1.0;"/><text fill="#0D47A1" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="119" x="414" y="69.9951">kommuniziert mit</text><!--link UC3 to UC1--><path d="M290.5,227.25 C290.5,213.38 290.5,194.82 290.5,180.4 " fill="none" id="UC3-UC1" style="stroke: #1976D2; stroke-width: 1.0; stroke-dasharray: 7.0,7.0;"/><polygon fill="#1976D2" points="290.5,175.29,286.5,184.29,290.5,180.29,294.5,184.29,290.5,175.29" style="stroke: #1976D2; stroke-width: 1.0;"/><text fill="#0D47A1" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="66" x="245.5" y="206.2451">«extend»</text><!--link Wartungstechniker to UC4--><path d="M137.02,343.3 C165.48,338.57 198.8,333.05 227.03,328.36 " fill="none" id="Wartungstechniker-UC4" style="stroke: #1976D2; stroke-width: 1.0;"/><polygon fill="#1976D2" points="232.24,327.5,222.7083,325.0206,227.3069,328.315,224.0124,332.9136,232.24,327.5" style="stroke: #1976D2; stroke-width: 1.0;"/><!--link Wartungstechniker to UC5--><path d="M137.02,364.7 C160.46,368.59 187.21,373.03 211.68,377.09 " fill="none" id="Wartungstechniker-UC5" style="stroke: #1976D2; stroke-width: 1.0;"/><polygon fill="#1976D2" points="216.86,377.95,208.6451,372.5171,211.9288,377.1234,207.3226,380.407,216.86,377.95" style="stroke: #1976D2; stroke-width: 1.0;"/><!--
@startuml
skinparam backgroundColor #FFFFFF
skinparam defaultFontName Helvetica
skinparam defaultFontSize 14
skinparam shadowing false
skinparam roundCorner 12
skinparam ArrowColor #1976D2
skinparam ArrowFontColor #0D47A1

skinparam actor {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
}
skinparam usecase {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
}
skinparam class {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
  AttributeFontColor #0D47A1
  HeaderBackgroundColor #BBDEFB
}
skinparam state {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
  ArrowColor #1976D2
  StartColor #222222
  EndColor #222222
}
skinparam sequence {
  ParticipantBackgroundColor #E3F2FD
  ParticipantBorderColor #1976D2
  ParticipantFontColor #0D47A1
  ActorBackgroundColor #E3F2FD
  ActorBorderColor #1976D2
  LifeLineBorderColor #90A4AE
  LifeLineBackgroundColor #ECEFF1
  BoxBorderColor #1976D2
}
skinparam activity {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
  DiamondBackgroundColor #FFF3E0
  DiamondBorderColor #FB8C00
  StartColor #222222
  EndColor #222222
  BarColor #455A64
}
left to right direction

actor Fahrgast
actor Wartungstechniker
actor "Banksystem" as Bank

rectangle "Fahrkartenautomat" {
  usecase "Fahrkarte kaufen" as UC1
  usecase "Bezahlen" as UC2
  usecase "Rabattkarte scannen" as UC3
  usecase "Automat warten" as UC4
  usecase "Fehlerbericht erstellen" as UC5
}

Fahrgast - -> UC1
UC1 .> UC2 : <<include>>
UC2 - -> Bank : kommuniziert mit
UC3 .> UC1 : <<extend>>

Wartungstechniker - -> UC4
Wartungstechniker - -> UC5
@enduml

