  EndColor #222222
  BarColor #455A64
}
left to right direction

actor Kunde
actor "Bezahldienstleister" as Bezahl

rectangle "Kino-System" {
  usecase "Ticket kaufen" as UC1
  usecase "Sitzplatz wählen" as UC2
}

