}
skinparam activity {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
  DiamondBackgroundColor #FFF3E0
  DiamondBorderColor #FB8C00
  StartColor #222222
  EndColor #222222
  BarColor #455A64
}
left to right direction

actor Fahrgast
actor Techniker

rectangle "Aufzugsystem" {
  usecase "Etage anfordern" as UC1
  usecase "Wartungsmodus aktivieren" as UC2
  usecase "Fehlerprotokoll auslesen" as UC3
}

Fahrgast - -> UC1
Techniker - -> UC2
Techniker - -> UC3
@enduml

