5067,187.08,236.07" style="stroke: #1976D2; stroke-width: 1.0;"/><!--link UC2 to UC3--><path d="M239.5,145.91 C239.5,132.59 239.5,113.29 239.5,98.41 " fill="none" id="UC2-UC3" style="stroke: #1976D2; stroke-width: 1.0; stroke-dasharray: 7.0,7.0;"/><polygon fill="#1976D2" points="239.5,93.15,235.5,102.15,239.5,98.15,243.5,102.15,239.5,93.15" style="stroke: #1976D2; stroke-width: 1.0;"/><text fill="#0D47A1" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="68" x="193.5" y="124.4951">«include»</text><!--link Timer to UC4--><path d="M97.05,354.3 C126.64,342.21 165.3,326.41 194.72,314.39 " fill="none" id="Timer-UC4" style="stroke: #1976D2; stroke-width: 1.0;"/><polygon fill="#1976D2" points="199.36,312.49,189.516,312.1813,194.7295,314.3765,192.5344,319.59,199.36,312.49" style="stroke: #1976D2; stroke-width: 1.0;"/><!--
@startuml
skinparam backgroundColor #FFFFFF
skinparam defaultFontName Helvetica
skinparam defaultFontSize 14
skinparam shadowing false
skinparam roundCorner 12
skinparam ArrowColor #1976D2
skinparam ArrowFontColor #0D47A1

skinparam actor {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
}
skinparam usecase {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
}
skinparam class {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
  AttributeFontColor #0D47A1
  HeaderBackgroundColor #BBDEFB
}
skinparam state {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
  ArrowColor #1976D2
  StartColor #222222
  EndColor #222222
}
skinparam sequence {
  ParticipantBackgroundColor #E3F2FD
  ParticipantBorderColor #1976D2
  ParticipantFontColor #0D47A1
  ActorBackgroundColor #E3F2FD
  ActorBorderColor #1976D2
  LifeLineBorderColor #90A4AE
  LifeLineBackgroundColor #ECEFF1
  BoxBorderColor #1976D2
}
skinparam activity {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
  DiamondBackgroundColor #FFF3E0
  DiamondBorderColor #FB8C00
  StartColor #222222
  EndColor #222222
  BarColor #455A64
}
left to right direction

actor Bewohner
actor Gast
actor "Zeitschaltuhr" as Timer

rectangle "Smart-Home-System" {
  usecase "Licht steuern" as UC1
  usecase "Tür entriegeln" as UC2
  usecase "Authentifizieren" as UC3
  usecase "Zeitplan ausführen" as UC4
}

Bewohner - -> UC1
Bewohner - -> UC2
Gast - -> UC1

UC2 .> UC3 : <<include>>
Timer - -> UC4
@enduml

