waltet</text><text fill="#0D47A1" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="9" x="477.5844" y="107.4723">1</text><text fill="#0D47A1" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="24" x="397.8905" y="153.5523">0..*</text><!--link Fahrer to Fahrzeug--><path d="M248.92,87.13 C271.74,110.38 300.96,140.14 325.09,164.72 " fill="none" id="Fahrer-Fahrzeug" style="stroke: #1976D2; stroke-width: 1.0;"/><text fill="#0D47A1" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="80" x="297" y="130.9951">fährt aktuell</text><text fill="#0D47A1" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="24" x="228.889" y="107.4723">0..*</text><text fill="#0D47A1" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="26" x="290.4376" y="153.5523">0..1</text><!--
@startuml
skinparam backgroundColor #FFFFFF
skinparam defaultFontName Helvetica
skinparam defaultFontSize 14
skinparam shadowing false
skinparam roundCorner 12
skinparam ArrowColor #1976D2
skinparam ArrowFontColor #0D47A1

skinparam actor {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
}
skinparam usecase {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
}
skinparam class {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
  AttributeFontColor #0D47A1
  HeaderBackgroundColor #BBDEFB
}
skinparam state {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
  ArrowColor #1976D2
  StartColor #222222
  EndColor #222222
}
skinparam sequence {
  ParticipantBackgroundColor #E3F2FD
  ParticipantBorderColor #1976D2
  ParticipantFontColor #0D47A1
  ActorBackgroundColor #E3F2FD
  ActorBorderColor #1976D2
  LifeLineBorderColor #90A4AE
  LifeLineBackgroundColor #ECEFF1
  BoxBorderColor #1976D2
}
skinparam activity {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
  DiamondBackgroundColor #FFF3E0
  DiamondBorderColor #FB8C00
  StartColor #222222
  EndColor #222222
  BarColor #455A64
}
class Fahrzeug {
  #kennzeichen: String
  #baujahr: int
  +starten(): void
}
class PKW {
  -anzahlSitze: int
}
class LKW {
  -maxZuladung: double
}
class Transporter {
  -laderaumvolumen: double
}
class Motor {
  -leistungPS: int
  -kraftstoffart: String
}
class Fahrer {
  -name: String
  -fuehrerscheinklasse: String
}
class Fuhrpark {
  -firmenname: String
  +fahrzeugHinzufuegen(fahrzeug: Fahrzeug): void
}

Fahrzeug <|- - PKW
Fahrzeug <|- - LKW
Fahrzeug <|- - Transporter
Fahrzeug *- - Motor : besteht aus
Fuhrpark "1" o- - "0..*" Fahrzeug : verwaltet
Fahrer "0..*" - - "0..1" Fahrzeug : fährt aktuell
@enduml

