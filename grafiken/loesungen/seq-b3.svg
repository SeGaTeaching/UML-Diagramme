cingAndGlyphs" textLength="212" x="301.5" y="139.5889">holeStatus(sendungsnummer)</text><path d="M452.5,159.8906 L525.5,159.8906 L525.5,167.8906 L515.5,177.8906 L446.5,177.8906 L446.5,165.8906 " fill="#EEEEEE" style="stroke: #000000; stroke-width: 1.0;"/><rect fill="none" height="62.8906" rx="6" ry="6" style="stroke: #000000; stroke-width: 2.0;" width="277" x="446.5" y="159.8906"/><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="34" x="461.5" y="173.8857">loop</text><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="178" x="540.5" y="174.8857">[für jeden Checkpoint]</text><line style="stroke: #1976D2; stroke-width: 1.0;" x1="535.5" x2="577.5" y1="201.7813" y2="201.7813"/><line style="stroke: #1976D2; stroke-width: 1.0;" x1="577.5" x2="577.5" y1="201.7813" y2="214.7813"/><line style="stroke: #1976D2; stroke-width: 1.0;" x1="536.5" x2="577.5" y1="214.7813" y2="214.7813"/><polygon fill="#1976D2" points="546.5,210.7813,536.5,214.7813,546.5,218.7813,542.5,214.7813" style="stroke: #1976D2; stroke-width: 1.0;"/><text fill="#0D47A1" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="134" x="542.5" y="196.4795">pruefeCheckpoint()</text><polygon fill="#1976D2" points="305.5,248.0781,295.5,252.0781,305.5,256.0781,301.5,252.0781" style="stroke: #1976D2; stroke-width: 1.0;"/><line style="stroke: #1976D2; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="299.5" x2="529.5" y1="252.0781" y2="252.0781"/><text fill="#0D47A1" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="88" x="311.5" y="246.7764">statusverlauf</text><polygon fill="#1976D2" points="44.5,278.375,34.5,282.375,44.5,286.375,40.5,282.375" style="stroke: #1976D2; stroke-width: 1.0;"/><line style="stroke: #1976D2; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="38.5" x2="288.5" y1="282.375" y2="282.375"/><text fill="#0D47A1" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="225" x="50.5" y="277.0732">zeigeStatusverlauf(statusverlauf)</text><!--
@startuml
skinparam backgroundColor #FFFFFF
skinparam defaultFontName Helvetica
skinparam defaultFontSize 14
skinparam shadowing false
skinparam roundCorner 12
skinparam ArrowColor #1976D2
skinparam ArrowFontColor #0D47A1

skinparam actor {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
}
skinparam usecase {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
}
skinparam class {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
  AttributeFontColor #0D47A1
  HeaderBackgroundColor #BBDEFB
}
skinparam state {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
  ArrowColor #1976D2
  StartColor #222222
  EndColor #222222
}
skinparam sequence {
  ParticipantBackgroundColor #E3F2FD
  ParticipantBorderColor #1976D2
  ParticipantFontColor #0D47A1
  ActorBackgroundColor #E3F2FD
  ActorBorderColor #1976D2
  LifeLineBorderColor #90A4AE
  LifeLineBackgroundColor #ECEFF1
  BoxBorderColor #1976D2
}
skinparam activity {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
  DiamondBackgroundColor #FFF3E0
  DiamondBorderColor #FB8C00
  StartColor #222222
  EndColor #222222
  BarColor #455A64
}
actor Kunde
participant "app: TrackingApp" as App
participant "dienst: Paketdienst" as Dienst

Kunde -> App: verfolgePaket(sendungsnummer)
activate App

App -> Dienst: holeStatus(sendungsnummer)
activate Dienst

loop für jeden Checkpoint
    Dienst -> Dienst: pruefeCheckpoint()
end

Dienst - -> App: statusverlauf
deactivate Dienst

App - -> Kunde: zeigeStatusverlauf(statusverlauf)
deactivate App
@enduml

