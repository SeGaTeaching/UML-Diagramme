32" y="175.1875"/><polygon fill="#1976D2" points="330,110.5938,340,114.5938,330,118.5938,334,114.5938" style="stroke: #1976D2; stroke-width: 1.0;"/><line style="stroke: #1976D2; stroke-width: 1.0;" x1="41" x2="336" y1="114.5938" y2="114.5938"/><text fill="#0D47A1" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="150" x="48" y="109.292">bestelleTaxi(standort)</text><polygon fill="#1976D2" points="645,140.8906,655,144.8906,645,148.8906,649,144.8906" style="stroke: #1976D2; stroke-width: 1.0;"/><line style="stroke: #1976D2; stroke-width: 1.0;" x1="352" x2="651" y1="144.8906" y2="144.8906"/><text fill="#0D47A1" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="198" x="359" y="139.5889">sucheFreienFahrer(standort)</text><polygon fill="#1976D2" points="820,171.1875,830,175.1875,820,179.1875,824,175.1875" style="stroke: #1976D2; stroke-width: 1.0;"/><line style="stroke: #1976D2; stroke-width: 1.0;" x1="667" x2="826" y1="175.1875" y2="175.1875"/><text fill="#0D47A1" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="146" x="674" y="169.8857">frageVerfuegbarkeit()</text><polygon fill="#1976D2" points="678,201.4844,668,205.4844,678,209.4844,674,205.4844" style="stroke: #1976D2; stroke-width: 1.0;"/><line style="stroke: #1976D2; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="672" x2="836" y1="205.4844" y2="205.4844"/><text fill="#0D47A1" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="74" x="684" y="200.1826">verfuegbar</text><polygon fill="#1976D2" points="363,231.7813,353,235.7813,363,239.7813,359,235.7813" style="stroke: #1976D2; stroke-width: 1.0;"/><line style="stroke: #1976D2; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="357" x2="661" y1="235.7813" y2="235.7813"/><text fill="#0D47A1" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="281" x="369" y="230.4795">fahrerZugewiesen(fahrerId, ankunftszeit)</text><polygon fill="#1976D2" points="52,262.0781,42,266.0781,52,270.0781,48,266.0781" style="stroke: #1976D2; stroke-width: 1.0;"/><line style="stroke: #1976D2; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="46" x2="346" y1="266.0781" y2="266.0781"/><text fill="#0D47A1" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="277" x="58" y="260.7764">zeigeFahrerdaten(fahrerId, ankunftszeit)</text><!--
@startuml
skinparam backgroundColor #FFFFFF
skinparam defaultFontName Helvetica
skinparam defaultFontSize 14
skinparam shadowing false
skinparam roundCorner 12
skinparam ArrowColor #1976D2
skinparam ArrowFontColor #0D47A1

skinparam actor {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
}
skinparam usecase {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
}
skinparam class {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
  AttributeFontColor #0D47A1
  HeaderBackgroundColor #BBDEFB
}
skinparam state {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
  ArrowColor #1976D2
  StartColor #222222
  EndColor #222222
}
skinparam sequence {
  ParticipantBackgroundColor #E3F2FD
  ParticipantBorderColor #1976D2
  ParticipantFontColor #0D47A1
  ActorBackgroundColor #E3F2FD
  ActorBorderColor #1976D2
  LifeLineBorderColor #90A4AE
  LifeLineBackgroundColor #ECEFF1
  BoxBorderColor #1976D2
}
skinparam activity {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
  DiamondBackgroundColor #FFF3E0
  DiamondBorderColor #FB8C00
  StartColor #222222
  EndColor #222222
  BarColor #455A64
}
actor Fahrgast
participant "app: TaxiApp" as App
participant "zentrale: Taxizentrale" as Zentrale
participant "fahrer: Fahrer" as Fahrer

Fahrgast -> App: bestelleTaxi(standort)
activate App

App -> Zentrale: sucheFreienFahrer(standort)
activate Zentrale

Zentrale -> Fahrer: frageVerfuegbarkeit()
activate Fahrer
Fahrer - -> Zentrale: verfuegbar
deactivate Fahrer

Zentrale - -> App: fahrerZugewiesen(fahrerId, ankunftszeit)
deactivate Zentrale

App - -> Fahrgast: zeigeFahrerdaten(fahrerId, ankunftszeit)
deactivate App
@enduml

