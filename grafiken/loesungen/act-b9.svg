="595.083"/><line style="stroke: #1976D2; stroke-width: 1.5;" x1="378.5" x2="635.5" y1="595.083" y2="595.083"/><line style="stroke: #1976D2; stroke-width: 1.5;" x1="635.5" x2="635.5" y1="595.083" y2="612.583"/><polygon fill="#1976D2" points="631.5,602.583,635.5,612.583,639.5,602.583,635.5,606.583" style="stroke: #1976D2; stroke-width: 1.0;"/><line style="stroke: #1976D2; stroke-width: 1.5;" x1="635.5" x2="635.5" y1="648.8799" y2="666.3799"/><line style="stroke: #1976D2; stroke-width: 1.5;" x1="635.5" x2="122.5" y1="666.3799" y2="666.3799"/><line style="stroke: #1976D2; stroke-width: 1.5;" x1="122.5" x2="122.5" y1="666.3799" y2="683.8799"/><polygon fill="#1976D2" points="118.5,673.8799,122.5,683.8799,126.5,673.8799,122.5,677.8799" style="stroke: #1976D2; stroke-width: 1.0;"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="45" x="99.5" y="24.7969">Kunde</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="55" x="366" y="24.7969">Support</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="97" x="586.5" y="24.7969">Fachabteilung</text><line style="stroke: #000000; stroke-width: 2.0;" x1="10" x2="10" y1="11.8018" y2="777.1768"/><line style="stroke: #000000; stroke-width: 2.0;" x1="234" x2="234" y1="11.8018" y2="777.1768"/><line style="stroke: #000000; stroke-width: 2.0;" x1="553" x2="553" y1="11.8018" y2="777.1768"/><line style="stroke: #000000; stroke-width: 2.0;" x1="717" x2="717" y1="11.8018" y2="777.1768"/><!--
@startuml
skinparam backgroundColor #FFFFFF
skinparam defaultFontName Helvetica
skinparam defaultFontSize 14
skinparam shadowing false
skinparam roundCorner 12
skinparam ArrowColor #1976D2
skinparam ArrowFontColor #0D47A1

skinparam actor {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
}
skinparam usecase {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
}
skinparam class {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
  AttributeFontColor #0D47A1
  HeaderBackgroundColor #BBDEFB
}
skinparam state {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
  ArrowColor #1976D2
  StartColor #222222
  EndColor #222222
}
skinparam sequence {
  ParticipantBackgroundColor #E3F2FD
  ParticipantBorderColor #1976D2
  ParticipantFontColor #0D47A1
  ActorBackgroundColor #E3F2FD
  ActorBorderColor #1976D2
  LifeLineBorderColor #90A4AE
  LifeLineBackgroundColor #ECEFF1
  BoxBorderColor #1976D2
}
skinparam activity {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
  DiamondBackgroundColor #FFF3E0
  DiamondBorderColor #FB8C00
  StartColor #222222
  EndColor #222222
  BarColor #455A64
}
skinparam ActivityStartColor black
skinparam ActivityEndColor black
skinparam ActivityBackgroundColor #E3F2FD
skinparam ActivityBorderColor #1976D2
skinparam ActivityFontColor #0D47A1
skinparam ActivityDiamondBackgroundColor #FFF9C4
skinparam ActivityDiamondBorderColor #FBC02D
!pragma useVerticalIf on

|#e3f2fd|Kunde|
start
:Reklamation einreichen;
|#fff3e0|Support|
repeat
  :Fall prüfen;
  if (Zusätzliche Informationen nötig?) then ([ja])
    |#e3f2fd|Kunde|
    :Informationen nachreichen;
    |#fff3e0|Support|
  else ([nein])
  endif
repeat while (Informationen unvollständig?)
:Lösung erarbeiten;
|#f3e5f5|Fachabteilung|
:Lösung umsetzen;
|#e3f2fd|Kunde|
:Rückmeldung erhalten;
stop
@enduml

