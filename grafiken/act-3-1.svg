9"/><text fill="#0D47A1" font-family="Helvetica" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="141" x="187" y="163.292">Heizung einschalten</text><ellipse cx="257.5" cy="207.5938" fill="#FFFFFF" rx="11" ry="11" style="stroke: #000000; stroke-width: 1.0;"/><ellipse cx="257.5" cy="207.5938" fill="#000000" rx="6" ry="6" style="stroke: #7F7F7F; stroke-width: 1.0;"/><line style="stroke: #1976D2; stroke-width: 1.5;" x1="164" x2="164" y1="30" y2="50"/><polygon fill="#1976D2" points="160,40,164,50,168,40,164,44" style="stroke: #1976D2; stroke-width: 1.0;"/><line style="stroke: #1976D2; stroke-width: 1.5;" x1="70.5" x2="70.5" y1="176.5938" y2="196.5938"/><polygon fill="#1976D2" points="66.5,186.5938,70.5,196.5938,74.5,186.5938,70.5,190.5938" style="stroke: #1976D2; stroke-width: 1.0;"/><line style="stroke: #1976D2; stroke-width: 1.5;" x1="257.5" x2="257.5" y1="176.5938" y2="196.5938"/><polygon fill="#1976D2" points="253.5,186.5938,257.5,196.5938,261.5,186.5938,257.5,190.5938" style="stroke: #1976D2; stroke-width: 1.0;"/><line style="stroke: #1976D2; stroke-width: 1.5;" x1="80.5" x2="70.5" y1="118.2969" y2="118.2969"/><line style="stroke: #1976D2; stroke-width: 1.5;" x1="70.5" x2="70.5" y1="118.2969" y2="140.2969"/><polygon fill="#1976D2" points="66.5,130.2969,70.5,140.2969,74.5,130.2969,70.5,134.2969" style="stroke: #1976D2; stroke-width: 1.0;"/><line style="stroke: #1976D2; stroke-width: 1.5;" x1="247.5" x2="257.5" y1="118.2969" y2="118.2969"/><line style="stroke: #1976D2; stroke-width: 1.5;" x1="257.5" x2="257.5" y1="118.2969" y2="140.2969"/><polygon fill="#1976D2" points="253.5,130.2969,257.5,140.2969,261.5,130.2969,257.5,134.2969" style="stroke: #1976D2; stroke-width: 1.0;"/><line style="stroke: #1976D2; stroke-width: 1.5;" x1="164" x2="164" y1="86.2969" y2="106.2969"/><polygon fill="#1976D2" points="160,96.2969,164,106.2969,168,96.2969,164,100.2969" style="stroke: #1976D2; stroke-width: 1.0;"/><!--
@startuml
skinparam backgroundColor #FFFFFF
skinparam defaultFontName Helvetica
skinparam defaultFontSize 14
skinparam shadowing false
skinparam roundCorner 12
skinparam ArrowColor #1976D2
skinparam ArrowFontColor #0D47A1

skinparam actor {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
}
skinparam usecase {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
}
skinparam class {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
  AttributeFontColor #0D47A1
  HeaderBackgroundColor #BBDEFB
}
skinparam state {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
  ArrowColor #1976D2
  StartColor #222222
  EndColor #222222
}
skinparam sequence {
  ParticipantBackgroundColor #E3F2FD
  ParticipantBorderColor #1976D2
  ParticipantFontColor #0D47A1
  ActorBackgroundColor #E3F2FD
  ActorBorderColor #1976D2
  LifeLineBorderColor #90A4AE
  LifeLineBackgroundColor #ECEFF1
  BoxBorderColor #1976D2
}
skinparam activity {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
  DiamondBackgroundColor #FFF3E0
  DiamondBorderColor #FB8C00
  StartColor #222222
  EndColor #222222
  BarColor #455A64
}
!pragma useVerticalIf on

skinparam ActivityStartColor black
skinparam ActivityEndColor black
skinparam ActivityBackgroundColor #E3F2FD
skinparam ActivityBorderColor #1976D2
skinparam ActivityFontColor #0D47A1
skinparam ActivityDiamondBackgroundColor #FFF9C4
skinparam ActivityDiamondBorderColor #FBC02D

start

:Temperatur prüfen;

if (Temperatur > 22°C?) then ([ja])
  :Fenster öffnen;
  stop
else ([nein])
  :Heizung einschalten;
  stop
endif

@enduml

