25,263.9453,329,253.9453,333,263.9453,329,259.9453" style="stroke: #1976D2; stroke-width: 1.5;"/><line style="stroke: #1976D2; stroke-width: 1.5;" x1="329" x2="329" y1="62" y2="450.8906"/><line style="stroke: #1976D2; stroke-width: 1.5;" x1="329" x2="180.5" y1="62" y2="62"/><polygon fill="#1976D2" points="190.5,58,180.5,62,190.5,66,186.5,62" style="stroke: #1976D2; stroke-width: 1.0;"/><line style="stroke: #1976D2; stroke-width: 1.5;" x1="168.5" x2="168.5" y1="418.8906" y2="438.8906"/><polygon fill="#1976D2" points="164.5,428.8906,168.5,438.8906,172.5,428.8906,168.5,432.8906" style="stroke: #1976D2; stroke-width: 1.0;"/><line style="stroke: #1976D2; stroke-width: 1.5;" x1="168.5" x2="168.5" y1="30" y2="50"/><polygon fill="#1976D2" points="164.5,40,168.5,50,172.5,40,168.5,44" style="stroke: #1976D2; stroke-width: 1.0;"/><!--
@startuml
skinparam backgroundColor #FFFFFF
skinparam defaultFontName Helvetica
skinparam defaultFontSize 14
skinparam shadowing false
skinparam roundCorner 12
skinparam ArrowColor #1976D2
skinparam ArrowFontColor #0D47A1

skinparam actor {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
}
skinparam usecase {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
}
skinparam class {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
  AttributeFontColor #0D47A1
  HeaderBackgroundColor #BBDEFB
}
skinparam state {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
  ArrowColor #1976D2
  StartColor #222222
  EndColor #222222
}
skinparam sequence {
  ParticipantBackgroundColor #E3F2FD
  ParticipantBorderColor #1976D2
  ParticipantFontColor #0D47A1
  ActorBackgroundColor #E3F2FD
  ActorBorderColor #1976D2
  LifeLineBorderColor #90A4AE
  LifeLineBackgroundColor #ECEFF1
  BoxBorderColor #1976D2
}
skinparam activity {
  BackgroundColor #E3F2FD
  BorderColor #1976D2
  FontColor #0D47A1
  DiamondBackgroundColor #FFF3E0
  DiamondBorderColor #FB8C00
  StartColor #222222
  EndColor #222222
  BarColor #455A64
}
!pragma useVerticalIf on

skinparam ActivityStartColor black
skinparam ActivityEndColor black
skinparam ActivityBackgroundColor #E3F2FD
skinparam ActivityBorderColor #1976D2
skinparam ActivityFontColor #0D47A1
skinparam ActivityDiamondBackgroundColor #FFF9C4
skinparam ActivityDiamondBorderColor #FBC02D

start

repeat
  :Passwort eingeben;

  if (Passwort korrekt?) then ([ja])
    :Zugang gewährt;
    stop
  
  elseif (Versuche >= 3?) then ([ja])
    :Zugang verweigert;
    stop
    
  else ([nein])
  endif

repeat while ([Passwort falsch, Versuche < 3])

@enduml

